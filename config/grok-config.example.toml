# Sanitized example/template for Grok CLI model wiring used by pitwall's
# grok-harness proxy lanes (glm-grok, gpt56-grok, kimi-grok, opus48-grok,
# sonnet5-grok). This is not a live config.
#
# Install: copy to ~/.grok/config.toml
#   cp config/grok-config.example.toml ~/.grok/config.toml
#
# Prerequisites:
# - CLIPROXY_API_KEY must be set in the environment the grok CLI runs in.
# - Model ids here must match both pitwall lanes.json and the model ids
#   actually served by your CLIProxyAPI instance (default base_url below).

[model."glm-5.2"]
model = "glm-5.2"
base_url = "http://127.0.0.1:8317/v1"
name = "GLM 5.2 (proxy)"
env_key = "CLIPROXY_API_KEY"

[model."gpt-5.6-sol"]
model = "gpt-5.6-sol"
base_url = "http://127.0.0.1:8317/v1"
name = "GPT 5.6 Sol (proxy)"
env_key = "CLIPROXY_API_KEY"

[model.kimi-k3]
model = "kimi-k3"
base_url = "http://127.0.0.1:8317/v1"
name = "Kimi K3 (proxy)"
env_key = "CLIPROXY_API_KEY"

[model.claude-opus-4-8]
model = "claude-opus-4-8"
base_url = "http://127.0.0.1:8317/v1"
name = "Claude Opus 4.8 (proxy)"
env_key = "CLIPROXY_API_KEY"

[model.claude-sonnet-5]
model = "claude-sonnet-5"
base_url = "http://127.0.0.1:8317/v1"
name = "Claude Sonnet 5 (proxy)"
env_key = "CLIPROXY_API_KEY"
